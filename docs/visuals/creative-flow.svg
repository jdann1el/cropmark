<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1800" role="img" aria-labelledby="creative-flow-title creative-flow-desc" id="creative-flow-root"><title id="creative-flow-title">Cropmark: concebir, comparar y corregir</title><desc id="creative-flow-desc">El trabajo original explora direcciones, compara una pieza representativa antes de extender el conjunto y corrige hasta tres veces; los ajustes concretos tienen una ruta abreviada.</desc><defs>
      <style>#creative-flow-root .scroller { overflow-x:auto }</style><marker id="creative-flow-cm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4b4b46"/></marker></defs><rect width="1600" height="1800" fill="#faf9f6"/><text x="64" y="92" font-family="Arial,sans-serif" font-size="48" font-weight="700" text-anchor="start" fill="#111111">Cropmark / Del brief a la pieza</text><text x="64" y="142" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#111111">Vista general · Comparar antes de extender</text><path d="M260 308 L260 376" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-cm-arrow)"/><path d="M260 496 L260 560" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-cm-arrow)"/><path d="M260 680 L260 760" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-cm-arrow)"/><path d="M456 820 L640 820" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-cm-arrow)"/><path d="M1000 820 L1120 820" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-cm-arrow)"/><path d="M1316 760 L1316 664" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-cm-arrow)"/><path d="M1316 544 L1316 432" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-cm-arrow)"/><path d="M456 436 L808.0 436.0 Q816 436 816.0 444.0 L816 760" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-cm-arrow)"/><rect x="64" y="208" width="392" height="100" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="260.0" y="251.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#111111">Brief y recursos</text><text x="260.0" y="281.0" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#111111">Mensaje, audiencia, identidad</text><polygon points="64,436.0 260.0,376 456,436.0 260.0,496" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="260.0" y="444.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#111111">Tipo de trabajo</text><rect x="64" y="560" width="392" height="120" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="260.0" y="613.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#111111">Original: estudiar referencias</text><text x="260.0" y="643.0" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#111111">Trazar masas, grupos y recortes</text><rect x="64" y="760" width="392" height="120" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="260.0" y="813.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#111111">Tres conceptos</text><text x="260.0" y="843.0" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#111111">Dos bocetos visuales</text><rect x="640" y="760" width="360" height="120" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="820.0" y="813.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#111111">Pieza representativa</text><text x="820.0" y="843.0" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#111111">Portada + interior exigente</text><rect x="1120" y="760" width="392" height="120" rx="6" fill="#f4dc3c" stroke="#111111" stroke-width="2"/><text x="1316.0" y="813.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#111111">Comparar como cliente</text><text x="1316.0" y="843.0" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#111111">Referencia y pieza en el feed</text><rect x="1120" y="544" width="392" height="120" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="1316.0" y="597.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#111111">Si sostiene la dirección</text><text x="1316.0" y="627.0" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#111111">Extender y revisar el conjunto</text><rect x="1120" y="312" width="392" height="120" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="1316.0" y="365.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#111111">Entrega editable</text><text x="1316.0" y="395.0" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#111111">PNG, fuentes, recursos y límites</text><rect x="292.0" y="513" width="128" height="32" fill="#faf9f6"/><text x="356" y="536" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#111111">ORIGINAL</text><rect x="569.0" y="391" width="206" height="32" fill="#faf9f6"/><text x="672" y="414" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#111111">COPIA / AJUSTE</text><text x="64" y="968" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#111111">La ruta breve conserva la referencia y diagnostica el cambio.</text><text x="64" y="1004" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#111111">La revisión inferior se aplica a la pieza representativa y al conjunto.</text><text x="64" y="1100" font-family="Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start" fill="#111111">Detalle / Decidir con el render</text><path d="M260 1280 L260 1352" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-cm-arrow)"/><path d="M456 1412 L640 1412" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-cm-arrow)"/><path d="M260 1472 L260 1544" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-cm-arrow)"/><path d="M456 1604 L640 1604" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-cm-arrow)"/><path d="M260 1664 L260.0 1712.0 Q260 1720 268.0 1720.0 L1308.0 1720.0 Q1316 1720 1316.0 1712.0 L1316 1664" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-cm-arrow)"/><path d="M1316 1544 L1316.0 1216.0 Q1316 1208 1308.0 1208.0 L456 1208" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-cm-arrow)"/><rect x="64" y="1152" width="392" height="128" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="260.0" y="1194.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#111111">Render y comparación</text><text x="260.0" y="1224.0" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#111111">Contenido íntegro, composición</text><text x="260.0" y="1254.0" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#111111">e interés frente a referencias</text><polygon points="64,1412.0 260.0,1352 456,1412.0 260.0,1472" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="260.0" y="1420.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#111111">¿Sostiene la dirección?</text><rect x="640" y="1352" width="392" height="120" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="836.0" y="1405.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#111111">Continuar el flujo</text><text x="836.0" y="1435.0" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#111111">Extender o entregar</text><polygon points="64,1604.0 260.0,1544 456,1604.0 260.0,1664" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="260.0" y="1612.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#111111">¿Quedan rondas útiles?</text><rect x="640" y="1544" width="392" height="120" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="836.0" y="1597.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#111111">Registrar límites</text><text x="836.0" y="1627.0" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#111111">Entregar sin aprobación</text><rect x="1120" y="1544" width="392" height="120" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="1316.0" y="1582.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#111111">Corregir la causa</text><text x="1316.0" y="1612.0" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#111111">Idea → referencias</text><text x="1316.0" y="1642.0" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#111111">Acabado → composición</text><rect x="523.0" y="1367" width="50" height="32" fill="#faf9f6"/><text x="548" y="1390" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#111111">SÍ</text><rect x="279.0" y="1493" width="50" height="32" fill="#faf9f6"/><text x="304" y="1516" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#111111">NO</text><rect x="523.0" y="1559" width="50" height="32" fill="#faf9f6"/><text x="548" y="1582" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#111111">NO</text><rect x="615.0" y="1675" width="50" height="32" fill="#faf9f6"/><text x="640" y="1698" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#111111">SÍ</text><text x="64" y="1772" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#111111">Máximo tres rondas tras la primera propuesta; cambiar de concepto consume una. La crítica no sustituye la aceptación humana.</text></svg>
