ive-flow-flow-arrow)"/><path d="M1396 644 L1396 760" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-flow-arrow)"/><path d="M1396 872 L1396 936" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-flow-arrow)"/><path d="M1196 996 L1064 996" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-flow-arrow)"/><path d="M664 996 L488 996" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-flow-arrow)"/><rect x="524.0" y="541" width="120" height="30" fill="#faf9f6"/><text x="584" y="562" font-size="17" font-weight="700" fill="#111" text-anchor="middle">ORIGINAL</text><rect x="284.0" y="683" width="192" height="30" fill="#faf9f6"/><text x="380" y="704" font-size="17" font-weight="700" fill="#111" text-anchor="middle">COPIA / AJUSTE</text><rect x="96" y="192" width="392" height="100" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="292.0" y="235.0" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Brief, audiencia</text><text x="292.0" y="265.0" font-size="22" font-weight="400" fill="#111" text-anchor="middle">y objetivo</text><rect x="96" y="348" width="392" height="120" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="292.0" y="401.0" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Contenido e identidad</text><text x="292.0" y="431.0" font-size="22" font-weight="400" fill="#111" text-anchor="middle">Recursos y herramientas</text><polygon points="80,584.0 292.0,524 504,584.0 292.0,644" fill="#fff" stroke="#111" stroke-width="2"/><text x="292.0" y="592.0" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Tipo de trabajo</text><rect x="664" y="524" width="400" height="120" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="864.0" y="577.0" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Estudiar referencias</text><text x="864.0" y="607.0" font-size="22" font-weight="400" fill="#111" text-anchor="middle">Extraer ideas del tema</text><rect x="1196" y="524" width="400" height="120" rx="6" fill="#F4DC3C" stroke="#111" stroke-width="2"/><text x="1396.0" y="577.0" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Tres conceptos</text><text x="1396.0" y="607.0" font-size="22" font-weight="400" fill="#111" text-anchor="middle">Dos bocetos visuales</text><rect x="96" y="760" width="392" height="112" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="292.0" y="809.0" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Conservar la referencia</text><text x="292.0" y="839.0" font-size="22" font-weight="400" fill="#111" text-anchor="middle">Diagnosticar el cambio</text><rect x="1196" y="760" width="400" height="112" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="1396.0" y="809.0" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Elegir y desarrollar</text><text x="1396.0" y="839.0" font-size="22" font-weight="400" fill="#111" text-anchor="middle">una pieza representativa</text><rect x="1196" y="936" width="400" height="120" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="1396.0" y="989.0" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Extender el conjunto</text><text x="1396.0" y="1019.0" font-size="22" font-weight="400" fill="#111" text-anchor="middle">con un sistema coherente</text><rect x="664" y="936" width="400" height="120" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="864.0" y="989.0" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Revisar el render</text><text x="864.0" y="1019.0" font-size="22" font-weight="400" fill="#111" text-anchor="middle">Completo, feed y técnica</text><rect x="96" y="936" width="392" height="120" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="292.0" y="989.0" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Entregar o corregir</text><text x="292.0" y="1019.0" font-size="22" font-weight="400" fill="#111" text-anchor="middle">según el flujo inferior</text><text x="80" y="1184" font-size="38" font-weight="700" fill="#111" text-anchor="start">Cómo se decide una corrección</text><text x="80" y="1228" font-size="23" font-weight="400" fill="#111" text-anchor="start">Máximo tres rondas después de la primera propuesta. Replantear también consume una ronda.</text><path d="M292 1400 L292 1452" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-flow-arrow)"/><path d="M504 1512 L664 1512" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-flow-arrow)"/><path d="M1064 1512 L1196 1512" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-flow-arrow)"/><path d="M292 1572 L292 1664" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-flow-arrow)"/><path d="M420 1748 L856.0 1748.0 Q864 1748 864.0 1756.0 L864 1788" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-flow-arrow)"/><path d="M864 1572 L864.0 1608.0 Q864 1616 856.0 1616.0 L584.0 1616.0 Q576 1616 576.0 1624.0 L576.0 1692.0 Q576 1700 568.0 1700.0 L420 1700" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-flow-arrow)"/><path d="M1396 1788 L1396.0 1660.0 Q1396 1652 1404.0 1652.0 L1672.0 1652.0 Q1680 1652 1680.0 1644.0 L1680.0 1356.0 Q1680 1348 1672.0 1348.0 L488 1348" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-flow-arrow)" stroke-dasharray="7 5"/><rect x="746.0" y="1589" width="48" height="30" fill="#faf9f6"/><text x="770" y="1610" font-size="17" font-weight="700" fill="#111" text-anchor="middle">NO</text><rect x="560.0" y="1469" width="48" height="30" fill="#faf9f6"/><text x="584" y="1490" font-size="17" font-weight="700" fill="#111" text-anchor="middle">SÍ</text><rect x="1106.0" y="1469" width="48" height="30" fill="#faf9f6"/><text x="1130" y="1490" font-size="17" font-weight="700" fill="#111" text-anchor="middle">SÍ</text><rect x="360.0" y="1599" width="48" height="30" fill="#faf9f6"/><text x="384" y="1620" font-size="17" font-weight="700" fill="#111" text-anchor="middle">NO</text><rect x="560.0" y="1715" width="48" height="30" fill="#faf9f6"/><text x="584" y="1736" font-size="17" font-weight="700" fill="#111" text-anchor="middle">NO</text><rect x="96" y="1296" width="392" height="104" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="292.0" y="1341.0" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Render inspeccionado</text><text x="292.0" y="1371.0" font-size="22" font-weight="400" fill="#111" text-anchor="middle">Idea, composición y acabado</text><polygon points="80,1512.0 292.0,1452 504,1512.0 292.0,1572" fill="#fff" stroke="#111" stroke-width="2"/><text x="292.0" y="1520.0" font-size="22" font-weight="700" fill="#111" text-anchor="middle">¿Cumple el encargo?</text><polygon points="664,1512.0 864.0,1452 1064,1512.0 864.0,1572" fill="#fff" stroke="#111" stroke-width="2"/><text x="864.0" y="1520.0" font-size="22" font-weight="700" fill="#111" text-anchor="middle">¿Sin defecto relevante?</text><rect x="1196" y="1452" width="400" height="120" rx="6" fill="#F4DC3C" stroke="#111" stroke-width="2"/><text x="1396.0" y="1505.0" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Entrega completa</text><text x="1396.0" y="1535.0" font-size="22" font-weight="400" fill="#111" text-anchor="middle">PNG + fuentes y recursos</text><polygon points="80,1724.0 292.0,1664 504,1724.0 292.0,1784" fill="#fff" stroke="#111" stroke-width="2"/><text x="292.0" y="1717.0" font-size="22" font-weight="700" fill="#111" text-anchor="middle">¿Quedan rondas</text><text x="292.0" y="1747.0" font-size="22" font-weight="400" fill="#111" text-anchor="middle">y recursos útiles?</text><rect x="664" y="1788" width="416" height="120" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="872.0" y="1841.0" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Registrar el límite</text><text x="872.0" y="1871.0" font-size="22" font-weight="400" fill="#111" text-anchor="middle">Entrega sin aprobación</text><rect x="1196" y="1788" width="400" height="120" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="1396.0" y="1826.0" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Si hay margen: corregir</text><text x="1396.0" y="1856.0" font-size="22" font-weight="400" fill="#111" text-anchor="middle">Idea → referencias</text><text x="1396.0" y="1886.0" font-size="22" font-weight="400" fill="#111" text-anchor="middle">Acabado → composición</text><path d="M292 1784 L292.0 1928.0 Q292 1936 300.0 1936.0 L1388.0 1936.0 Q1396 1936 1396.0 1928.0 L1396 1908" fill="none" stroke="#4b4b46" stroke-width="2.5" marker-end="url(#creative-flow-flow-arrow)" stroke-dasharray="7 5"/><rect x="360.0" y="1851" width="48" height="30" fill="#faf9f6"/><text x="384" y="1872" font-size="17" font-weight="700" fill="#111" text-anchor="middle">SÍ</text><text x="80" y="1972" font-size="20" font-weight="400" fill="#111" text-anchor="start">Flecha continua: avance. Flecha discontinua: corrección limitada. El archivo Mermaid conserva el flujo completo.</text></svg>
